user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'cache=$upstream_cache_status';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip for manifests and subtitles (not for binary segments)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain application/vnd.apple.mpegurl text/vtt application/json;

    # --------------------------------------------------------------------------
    # Upstreams
    # --------------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream frontend {
        zone frontend 64k;
        server ${FRONTEND_HOST}:${FRONTEND_PORT} resolve;
        keepalive 32;
    }

    upstream gateway {
        zone gateway 64k;
        server ${GATEWAY_HOST}:${GATEWAY_PORT} resolve;
        keepalive 32;
    }

    upstream cdn_origin {
        zone cdn_origin 64k;
        server ${CDN_ORIGIN_HOST}:${CDN_ORIGIN_PORT} resolve;
        keepalive 64;
    }

    upstream cache_purger {
        zone cache_purger 32k;
        server ${CACHE_PURGER_HOST}:${CACHE_PURGER_PORT} resolve;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # Shared cache zone for HLS segments
    # --------------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/hls
        levels=1:2
        keys_zone=hls:256m
        max_size=50g
        inactive=30d
        use_temp_path=off;

    # --------------------------------------------------------------------------
    # Map file extensions to cache behavior
    # --------------------------------------------------------------------------
    map $uri $hls_cache_control {
        ~*\.m3u8$ "public, max-age=60";
        ~*\.ts$   "public, max-age=31536000, immutable";
        ~*\.aac$  "public, max-age=31536000, immutable";
        ~*\.vtt$  "public, max-age=31536000, immutable";
        ~*\.mp4$  "public, max-age=31536000, immutable";
        ~*\.m4s$  "public, max-age=31536000, immutable";
        default    "public, max-age=300";
    }

    # --------------------------------------------------------------------------
    # CORS headers for media playback
    # --------------------------------------------------------------------------
    map $request_method $cors_method {
        OPTIONS 1;
        GET 1;
        HEAD 1;
        default 0;
    }

    # --------------------------------------------------------------------------
    # Connection header for WebSocket upgrade support on the frontend proxy
    # --------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Reflect the caller's Origin when present; fall back to wildcard for
    # requests without an Origin header. In production, replace the wildcard
    # default with an explicit allow-list of player domains.
    map $http_origin $cors_allow_origin {
        "~^https?://.*$" $http_origin;
        default "*";
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;

        # Every HLS request, including a proxy-cache HIT, crosses this internal
        # fail-closed guard first. Deletion writes a durable exact-video
        # tombstone here before origin objects are removed, so an old signed URL
        # cannot keep serving a cached object after DELETE.
        location = /_hls_cache_guard {
            internal;
            proxy_pass http://cache_purger/v1/guard;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Connection "";
            proxy_set_header X-HLS-URI $request_uri;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }

        # ----------------------------------------------------------------------
        # API requests -> gateway
        # ----------------------------------------------------------------------
        location /api/ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Preserve large upload bodies and long transcode-status polling
            client_max_body_size 20g;
            # Stream request bodies directly to upstream instead of buffering
            # to temp files — critical for chunked multipart uploads
            proxy_request_buffering off;
            client_body_buffer_size 256k;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # HLS manifests / segments -> CDN origin with aggressive caching
        # ----------------------------------------------------------------------
        location /hls/ {
            auth_request /_hls_cache_guard;

            proxy_pass http://cdn_origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Range requests are required for HLS and progressive download
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            # Cache configuration
            proxy_cache hls;
            proxy_cache_valid 200 206 60s;
            proxy_cache_key "$scheme$request_method$host$request_uri$http_range";
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
            # Authorization is represented by the signed token in request_uri,
            # so each cache entry remains credential-scoped. Replace the
            # origin's private response policy with one coherent edge policy.
            proxy_ignore_headers Cache-Control Expires;
            proxy_hide_header Cache-Control;
            proxy_hide_header Set-Cookie;
            # Strip upstream CORS headers — nginx owns CORS at the edge so the
            # browser receives a single Access-Control-Allow-Origin (cdn-origin's
            # middleware.CORS would otherwise duplicate it and break playback).
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Expose-Headers;

            # Always revalidate manifests; segments are immutable
            proxy_cache_revalidate on;

            # Add cache status header for debugging
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control $hls_cache_control always;

            # CORS
            if ($cors_method = 1) {
                # add_header directives inside an if block replace inherited
                # add_header values, so repeat the cache diagnostics/policy.
                add_header X-Cache-Status $upstream_cache_status always;
                add_header Cache-Control $hls_cache_control always;
                add_header Access-Control-Allow-Origin $cors_allow_origin always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Range, X-Requested-With" always;
                add_header Access-Control-Expose-Headers "Content-Length, Content-Range, X-Cache-Status, Cache-Control" always;
            }

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $cors_allow_origin always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Range, X-Requested-With" always;
                add_header Access-Control-Max-Age 86400 always;
                return 204;
            }
        }

        # ----------------------------------------------------------------------
        # Dashboard / Next.js frontend -> frontend service
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Next.js HMR in development
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ----------------------------------------------------------------------
        # Default health check
        # ----------------------------------------------------------------------
        location = /nginx-health {
            access_log off;
            proxy_pass http://cache_purger/health;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;
        }
    }
}
